services:
  go-db:
    image: postgres:16-alpine
    container_name: go-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /root/u05-go/go-data/postgres:/var/lib/postgresql/data
    networks:
      - u00net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: go-link-shortener
    build:
      context: /root/u05-go-src
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "8500:3000"
    depends_on:
      go-db:
        condition: service_healthy
    networks:
      - u00net

networks:
  u00net:
    external: true
